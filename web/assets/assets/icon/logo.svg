<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background gradient: deep indigo → mid indigo → light indigo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4338ca"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <!-- Clip to rounded-square shape -->
    <clipPath id="shape">
      <rect width="100" height="100" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- 1. Background -->
  <rect width="100" height="100" rx="24" ry="24" fill="url(#bg)"/>

  <!-- 2. Primary mountain peak (summit at 50,24 — matches cross bottom) -->
  <polygon
    points="50,24  5,82  95,82"
    fill="white" fill-opacity="0.20"
    clip-path="url(#shape)"/>

  <!-- 3. Secondary peak for depth -->
  <polygon
    points="72,38  45,82  100,82"
    fill="white" fill-opacity="0.12"
    clip-path="url(#shape)"/>

  <!-- 4. Cross at summit -->
  <!-- Vertical bar -->
  <rect x="45.5" y="5"  width="9"  height="22" rx="3" fill="white"/>
  <!-- Horizontal bar -->
  <rect x="35"   y="13" width="30" height="8.5" rx="3" fill="white"/>
</svg>
